name: Propose a game compatibility target
description: Propose an early iPhone OS game to make playable on Windows.
labels: ["game target"]
body:
  - type: input
    id: game
    attributes:
      label: Game title
    validations:
      required: true
  - type: input
    id: game_version
    attributes:
      label: Exact version, build, and region
    validations:
      required: true
  - type: input
    id: bundle_identity
    attributes:
      label: Bundle identifier and CFBundleVersion
      description: Copy these from the embedded Info.plist or local tapHLE --info output when available.
  - type: input
    id: archive_item
    attributes:
      label: Maintainer-supplied canonical Archive.org item URL
      description: Optional. Do not search for or guess an item; use the exact https://archive.org/details/<identifier> URL.
  - type: input
    id: archive_filename
    attributes:
      label: Exact Archive.org IPA filename
      description: Required when an Archive.org item is referenced.
  - type: textarea
    id: current_state
    attributes:
      label: What currently happens in tapHLE?
      description: Include how far the game gets and any visible or logged failure.
    validations:
      required: true
  - type: textarea
    id: milestone
    attributes:
      label: Smallest useful next milestone
      placeholder: Reach the main menu with working audio and input.
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Can you help test the exact game version on Windows?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: checkboxes
    id: legal
    attributes:
      label: Artifact check
      options:
        - label: I will not upload an app, extracted assets, keys, save data, or other proprietary payloads.
          required: true
        - label: Any Archive.org reference above is exact, maintainer-supplied, and follows compatibility/README.md, including current-market and takedown rules.
          required: true
